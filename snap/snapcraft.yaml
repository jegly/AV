# Store name only. The two-letter name "av" is reserved by the store, so the
# published snap is "audiovisual"; everything the user actually sees is still
# AV - the launcher name, window title, icon, org.av.player, the `av` binary
# and avrc are all unchanged. Do not confuse this with the part named `av`
# below, or with adopt-info, which references that part.
name: audiovisual
adopt-info: av
grade: stable
base: core26
summary: A local-only audio and video player
description: |
  AV plays audio and video files from your own machine. It does not stream,
  cast, serve, discover devices, fetch metadata, check for updates, or connect
  to a network at all.

  That is enforced twice over. Every module that opens a socket is left out of
  the build, and this snap does not request the `network` interface, so snapd
  denies network access in the kernel regardless of what the code does.

  AV is a fork of VLC.
confinement: strict
compression: lzo

# The library linter's "unused library" detection only sees direct NEEDED
# links from the app's own command binary. It cannot see what Qt's XCB
# platform plugin or VLC's own plugins pull in via dlopen() at runtime, so
# it silently strips libraries that are genuinely required (libX11, libxcb,
# EGL/GLX, libproxy's backend, etc. - each one only surfacing as a runtime
# "cannot open shared object file" crash, one at a time). Disabling it
# entirely rather than allowlisting library-by-library.
lint:
  ignore:
    - library

# 64-bit Intel/AMD only. AV is built with -march=x86-64-v3 (AVX2/BMI2/FMA,
# Haswell 2013 and newer), so there is nothing to gain from building the other
# architectures and a lot of CI time to lose.
platforms:
  amd64:

plugs:
  desktop:
    mount-host-font-cache: false

hooks:
  configure:
    plugs:
      - desktop

apps:
  # Matches the snap name deliberately: when they differ, snapd names the
  # command <snap>.<app> ("audiovisual.av"). Keeping them equal gives a plain
  # `snap run audiovisual` and an exported Exec=/snap/bin/audiovisual.
  audiovisual:
    desktop: av.desktop
    command: usr/bin/av-snap-wrapper.sh
    # No kde-neon-6 here: `snapcraft extensions` confirms it supports only
    # core22 and core24, not core26. Staying on core26 matters because it is
    # the only base whose glibc matches this build host, which is what lets
    # --destructive-mode work without LXD. Qt6 is therefore staged into the
    # snap directly (see the qt6-runtime part) rather than mounted from a
    # content snap.
    extensions:
      - gpu
    environment:
      # Do NOT force QT_QPA_PLATFORM=xcb. Forcing xcb makes VLC's Qt GUI use
      # its X11 compositor path for embedding the video surface, which goes
      # through the X11 Composite/Damage extensions over XWayland - this is
      # what was causing video to open in its own separate top-level window
      # instead of embedding in the player UI. Real upstream VLC 4's snap
      # (`snap connections vlc` on the --edge channel, same major version as
      # this fork) does not force a platform and ships both `wayland` and
      # `x11` plugs; on a Wayland session Qt picks wayland by default, which
      # embeds video via a native wl_subsurface instead.
      QT_PLUGIN_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins
      QML2_IMPORT_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/qml
    common-id: org.av.player
    plugs:
      # Deliberately absent: network, network-bind, network-observe,
      # avahi-control, avahi-observe. Their absence is the confinement half of
      # AV's no-network guarantee - do not add them back without removing
      # that claim from the description above.
      #
      # Also absent: audio-record and camera (playback only), dvb and
      # optical-drive (no tuner or disc support), mount-observe and udisks2
      # (device enumeration), removable-media is kept so external drives work.
      # opengl, pulseaudio and desktop-legacy were missing entirely - not a
      # deliberate exclusion, just never added. Found by diffing against
      # upstream VLC's actual published/working snap (`snap connections vlc`):
      # opengl grants /dev/dri device access (the gpu extension's content
      # interface alone only provides Mesa's userspace libraries, not the
      # device node - MESA-LOADER "failed to retrieve device information"
      # without it). pulseaudio grants the actual pulse-protocol socket VLC's
      # audio module connects to, which is a different interface than
      # pipewire's native-protocol socket ("Connection refused" without it).
      # wayland was also missing - needed for native video-surface embedding
      # on a Wayland session, see the QT_QPA_PLATFORM comment above.
      - audio-playback
      - desktop-legacy
      - home
      - opengl
      - pulseaudio
      - removable-media
      - screen-inhibit-control
      - pipewire
      - wayland
      - x11
    slots:
      - mpris

parts:
  av:
    source: .
    source-type: git
    plugin: nil

    override-pull: |
      craftctl default
      craftctl set version=$(git describe --always HEAD)

    override-build: |
      export PATH=$PWD/extras/tools/build/bin:${PATH:-}
      export LD_LIBRARY_PATH=$(pwd)/src/.libs/:$(pwd)/lib/.libs/:${LD_LIBRARY_PATH:-}

      # /tmp may be mounted noexec on hardened hosts, which breaks ffmpeg's
      # configure sanity check. Keep TMPDIR inside the build tree.
      export TMPDIR="$PWD/contrib/tmp"
      mkdir -p "$TMPDIR"

      cd extras/tools
      ./bootstrap
      make -j ${CRAFT_PARALLEL_BUILD_COUNT} all
      cd ../../

      # Same three switches as the local build: no network, no stream output,
      # no disc. They drop whole contrib packages, so this is also the single
      # biggest saving in build time.
      cd contrib && mkdir -p linux && cd linux
      ../bootstrap \
          --host=${CRAFT_ARCH_TRIPLET_BUILD_FOR} \
          --disable-net \
          --disable-sout \
          --disable-disc
      make list
      make -j1 fetch
      make -j ${CRAFT_PARALLEL_BUILD_COUNT}
      cd ../..

      extras/av/configure-av.sh build \
          --prefix=/usr \
          -Dmerge-ffmpeg=true
      ninja -C build -j ${CRAFT_PARALLEL_BUILD_COUNT}
      DESTDIR="${CRAFT_PART_INSTALL}" ninja -C build install

      find ${CRAFT_PART_INSTALL}/usr/lib -name "*.la" -delete
      find ${CRAFT_PART_INSTALL}/usr/lib -path "*/cmake/*" -delete
      rm -rf ${CRAFT_PART_INSTALL}/usr/include
      rm -rf ${CRAFT_PART_INSTALL}/usr/share/doc
      rm -rf ${CRAFT_PART_INSTALL}/usr/share/man
      rm -f ${CRAFT_PART_INSTALL}/usr/bin/X11

      # The tray icon has to be resolvable by the host shell: StatusNotifierItem
      # passes an icon *name* over D-Bus, and the host cannot read anything
      # under $SNAP. Exporting it to the snap root is what makes it render.
      install -Dm644 share/icons/av.svg \
          ${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/scalable/apps/av.svg
      cp share/icons/av.svg ${CRAFT_PART_INSTALL}/av.svg
      # Move (not copy) this out of usr/share/applications/: if the original
      # stays there too, snapd's desktop-file export finds BOTH it and the
      # rewritten root-level copy below, producing two separate launcher
      # icons for one snap.
      mv ${CRAFT_PART_INSTALL}/usr/share/applications/av.desktop \
          ${CRAFT_PART_INSTALL}/av.desktop
      sed -i 's|^Icon=.*|Icon=/av.svg|' ${CRAFT_PART_INSTALL}/av.desktop
      sed -i 's|TryExec=.*|TryExec=/snap/bin/av|' ${CRAFT_PART_INSTALL}/av.desktop

    build-packages:
      - autoconf
      - automake
      - autopoint
      - bison
      - flex
      - g++
      - git
      - gperf
      - libtool
      - libtool-bin
      - make
      - meson
      - nasm
      - ninja-build
      - pkgconf
      - python3
      - ragel
      - yasm
      # Qt6 development packages: without kde-neon-6 there is no SDK snap
      # providing these.
      - qt6-base-dev
      - qt6-base-private-dev
      - qt6-declarative-dev
      - qt6-declarative-private-dev
      - qt6-svg-dev
      - qt6-shadertools-dev
      # platform headers contrib does not build
      - libdrm-dev
      - libpulse-dev
      - libudev-dev
      - libva-dev
      - libvdpau-dev
      - libwayland-dev
      - libx11-dev
      - libxcb1-dev
      - libxkbcommon-dev
      - wayland-protocols

    stage-packages:
      # Derived from `ldd` over the built binary and all 308 plugins, not
      # guessed. Two things fall out of that:
      #
      #  * ffmpeg is NOT here. contrib links libavcodec/libavformat/libavutil
      #    statically (ldd reports 0 dynamic references), so staging Ubuntu's
      #    libav*60 would have shipped a second, older ffmpeg - 8.0.1, with no
      #    security upload since Feb 2026 - beside our contrib 8.1.2.
      #  * the same applies to dav1d, aom, vpx, theora, matroska, ass, taglib,
      #    freetype, fribidi, samplerate, soxr and ebur128: all contrib-static.
      #
      # Also gone from upstream VLC's snap: openjdk-8-jdk (a whole JRE, for
      # BluRay BD-J), plus the network, scripting, broadcast, disc and encoder
      # libraries.
      - dbus-x11
      - fonts-freefont-ttf
      - libasound2t64
      - libdrm2
      - libegl1
      - libfontconfig1
      - libgl1
      - libglib2.0-0t64
      - libglx0
      - libharfbuzz0b
      - libnotify4
      - libpulse0
      - libsqlite3-0
      - libudev1
      - libva-drm2
      - libva-wayland2
      - libva-x11-2
      - libva2
      - libvdpau1
      - libvulkan1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcb-composite0
      - libxcb-damage0
      - libxcb-dri3-0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb1
      - libxcomposite1
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxrandr2
      - zlib1g

  # Qt6 6.10.2 from the Ubuntu 26.04 archive. This is what kde-neon-6 would
  # have provided; it costs snap size but keeps us on a base with a current
  # glibc and current system libraries.
  qt6-runtime:
    plugin: nil
    stage-packages:
      - libqt6core6t64
      - libqt6gui6
      - libqt6widgets6
      - libqt6qml6
      - libqt6quick6
      - libqt6quickcontrols2-6
      - libqt6svg6
      # libqt6svg6 alone is the SVG library, not the rasterizer plugins
      # (libqsvg.so / libqsvgicon.so). Without this, every SVG icon in the
      # interface - including the tray icon - silently fails to load.
      - qt6-svg-plugins
      - libqt6opengl6
      - libqt6network6
      - qt6-qpa-plugins
      # qt6-qpa-plugins does NOT include the wayland platform plugin - Qt
      # packages that as a separate module. Without this, "Could not find
      # the Qt platform plugin wayland" and Qt silently falls back to xcb,
      # meaning wayland was never actually in effect despite the plug/env
      # changes intended to enable it.
      - qt6-wayland
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-layouts
      - qml6-module-qtqml-workerscript
    # No stage: filter here deliberately. Qt6's packages pull in dozens of
    # transitive libraries (fontconfig, harfbuzz, the XCB helper libs the
    # XCB platform plugin dlopens, EGL/GLX, wayland-client, xkbcommon-x11,
    # ICU) that a hand-curated allowlist kept missing one at a time, each
    # one only surfacing as a runtime crash. Trust what stage-packages
    # already correctly resolved instead of re-filtering it.

  wrapper:
    plugin: dump
    after: [av]
    source: extras/av
    organize:
      av-snap-wrapper.sh: usr/bin/av-snap-wrapper.sh
    stage:
      - usr/bin/av-snap-wrapper.sh
